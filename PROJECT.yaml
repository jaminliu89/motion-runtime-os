schema_version: 3
product:
  name: Motion Runtime OS
  north_star: provider-neutral-motion-projects-that-render-and-pass-qa
  primary_user: creator_director_agent
  primary_loop: [brief, storyboard, scene_graph, timeline, motion_ir, route, render, qa]
phase:
  id: cross_provider_semantic_parity
  completed_gate: approved_golden_baseline_plus_second_provider_real_execution
  exit_gate: eliminate_known_semantic_downgrades_plus_cross_provider_semantic_qa
sources:
  product: docs/PRD.md
  architecture: docs/ARCHITECTURE.md
  tasks: docs/MASTER_TASK.md
contracts:
  motion_ir: schemas/motion-ir.schema.json
  storyboard: schemas/storyboard.schema.json
  scene_graph: schemas/scene-graph.schema.json
  timeline: schemas/timeline.schema.json
  render_job: schemas/render-job.schema.json
  render_result: schemas/render-result.schema.json
  artifact_manifest: schemas/artifact-manifest.schema.json
quality:
  gate: quality/MOTION_QUALITY_GATE.yaml
  golden_sample: quality/GOLDEN_SAMPLE_SPEC.yaml
  golden_baseline: quality/golden-baselines/cinematic-intro/baseline-fingerprint.json
  visual_regression: scripts/visual-regression.mjs
  media_probe: scripts/verify-media-streams.mjs
execution:
  primary_provider: remotion
  secondary_provider: hyperframes
  provider_contract: runtime/providers/provider-contract.mjs
  remotion_adapter: runtime/providers/remotion-provider.mjs
  hyperframes_adapter: runtime/providers/hyperframes-provider.mjs
  hyperframes_compiler: scripts/compile-hyperframes-project.mjs
  generic_renderer: src/compositions/GenericMotion.tsx
  ci:
    remotion: .github/workflows/remotion-walking-skeleton.yml
    provider_independence: .github/workflows/provider-independence.yml
  evidence: [mp4, render_result, artifact_manifest, deterministic_keyframes, png_keyframes, media_probe, visual_diff_report, provider_comparison, compile_report]
verified:
  golden_baseline:
    id: cinematic-intro-v1
    workflow_run: 32886279334
  provider_independence:
    workflow_run: 32887649705
    proven: true
    semantic_equivalence: false
rules:
  provider_neutral_ir: true
  render_success_is_not_done: true
  qa_evidence_required: true
  provider_conformance_required: true
  golden_baseline_requires_approval: true
  unverified_provider_cannot_be_marked_verified: true
  provider_independence_is_not_semantic_equivalence: true
  semantic_equivalence_is_not_pixel_identity: true
  future_adapters_do_not_enter_mvp: [blender, unreal]
