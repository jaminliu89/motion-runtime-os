name: Remotion Walking Skeleton

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'runtime/**'
      - 'examples/**'
      - 'adapters/**'
      - 'quality/**'
      - 'schemas/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/remotion-walking-skeleton.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'runtime/**'
      - 'examples/**'
      - 'adapters/**'
      - 'quality/**'
      - 'schemas/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Quality runner
        run: npm run qa:run
      - name: Derive keyframes
        run: npm run keyframes
      - name: Bundle Remotion
        run: npm run build
      - name: Render cinematic intro through provider adapter
        run: npm run provider:remotion
      - name: Render multi-scene fixture
        run: npm run render:multi
      - name: Verify media streams in provider artifact
        run: npm run media:probe
      - name: Render deterministic PNG keyframes
        run: npm run frames:intro
      - name: Pixel visual regression
        run: npm run visual:diff
      - name: Verify render artifacts
        run: |
          test -s out/cinematic-intro.mp4
          test -s out/cinematic-intro.render-result.json
          test -s out/multi-scene-demo.mp4
          test -s evidence/media-probe/cinematic-intro.json
          test -n "$(find evidence/frames/current -name '*.png' -print -quit)"
      - name: Generate artifact manifest
        run: npm run artifact:manifest
      - name: Verify evidence
        run: |
          test -s out/cinematic-intro.artifact.json
          test -s out/cinematic-intro.keyframes.json
          test -s evidence/visual-diff/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: motion-runtime-evidence
          path: |
            out/cinematic-intro.mp4
            out/cinematic-intro.render-result.json
            out/multi-scene-demo.mp4
            out/cinematic-intro.artifact.json
            out/cinematic-intro.keyframes.json
            evidence/media-probe/cinematic-intro.json
            evidence/frames/current/*.png
            evidence/visual-diff/**
          if-no-files-found: error
