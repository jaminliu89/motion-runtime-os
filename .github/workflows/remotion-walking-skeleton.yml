name: Remotion Walking Skeleton

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'adapters/**'
      - 'quality/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/remotion-walking-skeleton.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'adapters/**'
      - 'quality/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Quality runner
        run: npm run qa:run
      - name: Derive keyframes
        run: npm run keyframes
      - name: Bundle Remotion
        run: npm run build
      - name: Render cinematic intro
        run: npm run render:intro
      - name: Render multi-scene fixture
        run: npm run render:multi
      - name: Verify render artifacts
        run: |
          test -s out/cinematic-intro.mp4
          test -s out/multi-scene-demo.mp4
      - name: Generate artifact manifest
        run: npm run artifact:manifest
      - name: Verify evidence
        run: |
          test -s out/cinematic-intro.artifact.json
          test -s out/cinematic-intro.keyframes.json
      - uses: actions/upload-artifact@v4
        with:
          name: motion-runtime-evidence
          path: |
            out/cinematic-intro.mp4
            out/multi-scene-demo.mp4
            out/cinematic-intro.artifact.json
            out/cinematic-intro.keyframes.json
          if-no-files-found: error
