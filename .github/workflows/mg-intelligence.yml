name: MG Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'runtime/mg_planner.py'
      - 'runtime/mg_compiler.py'
      - 'runtime/mg_qa.py'
      - 'runtime/art_direction.py'
      - 'runtime/style_selector.py'
      - 'runtime/preference_learning.py'
      - 'runtime/preference_hierarchy.py'
      - 'runtime/preference_evaluation.py'
      - 'schemas/mg-plan.schema.json'
      - 'tests/**'
      - 'src/compositions/GenericMotion.tsx'
      - 'docs/MG_INTELLIGENCE_SPEC.md'
      - 'docs/ART_DIRECTION_ENGINE_SPEC.md'
      - '.github/workflows/mg-intelligence.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'schemas/mg-plan.schema.json'
      - 'tests/**'
      - 'src/compositions/GenericMotion.tsx'
      - 'docs/**'
      - '.github/workflows/mg-intelligence.yml'

jobs:
  mg-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install pytest jsonschema
      - name: Run semantic MG QA art direction selector and preference tests
        run: python -m pytest -q tests/test_mg_planner.py tests/test_mg_compiler.py tests/test_mg_qa.py tests/test_art_direction.py tests/test_art_direction_compiler.py tests/test_style_selector.py tests/test_preference_learning.py tests/test_preference_hierarchy.py
      - name: Validate learned preference through selector and Motion IR
        run: >-
          python -c "import json; from jsonschema import Draft202012Validator; from runtime.mg_planner import plan; from runtime.preference_learning import compile_preference_evidence; from runtime.style_selector import select; from runtime.art_direction import apply_profile; from runtime.mg_compiler import compile_motion_ir; from runtime.mg_qa import evaluate; d={'segments':[{'id':'r','start':0,'end':3,'transcript':'30 products','narrative_function':'proof','attention_target':'30','confidence':.9},{'id':'t','start':3,'end':6,'transcript':'but quantity is not the problem','narrative_function':'turn','attention_target':'but','confidence':.9},{'id':'v','start':6,'end':10,'transcript':'the real problem is the loop','narrative_function':'revelation','attention_target':'real problem','confidence':.93}]}; e=compile_preference_evidence([{'action':'prefer','preferred_profile':'editorial_restraint','weight':3},{'action':'prefer','preferred_profile':'editorial_restraint','weight':3},{'action':'reject','preferred_profile':'precision_tech','weight':2}]); choice=select({'content_type':'product','preference_evidence':e},d); assert choice['preference_evidence_applied']; p=apply_profile(plan(d),choice['selected_profile']); Draft202012Validator(json.load(open('schemas/mg-plan.schema.json'))).validate(p); q=evaluate(p); assert q['status']=='pass', q; m=compile_motion_ir(p,d,source_asset_ref='assets/source.mp4'); Draft202012Validator(json.load(open('schemas/motion-ir.schema.json'))).validate(m); assert m['art_direction']['profile_id']==choice['selected_profile']; print('Human Preference → Style Selection → MG Plan → Motion IR PASS')"
      - name: Validate scoped hierarchy and held-out preference lift
        run: >-
          python -c "from runtime.preference_hierarchy import compile_scopes; from runtime.preference_evaluation import evaluate; rows=[{'project_id':'p1','brand_id':'b1','user_id':'u1','action':'prefer','preferred_profile':'editorial_restraint','weight':3},{'project_id':'p1','brand_id':'b1','user_id':'u1','action':'prefer','preferred_profile':'editorial_restraint','weight':3},{'project_id':'other','brand_id':'b1','user_id':'u1','action':'reject','preferred_profile':'precision_tech','weight':2}]; e=compile_scopes(rows,project_id='p1',brand_id='b1',user_id='u1'); d={'segments':[{'id':'s','start':0,'end':2,'narrative_function':'setup','attention_target':'x'}]}; held=[{'context':{'content_type':'product'},'director_ir':d,'expected_profile':'editorial_restraint'},{'context':{'content_type':'business'},'director_ir':d,'expected_profile':'editorial_restraint'}]; r=evaluate(held,evidence={'confidence':.9,'profile_bias':e['profile_bias']}); assert r['lift']>0,r; print('Project/Brand/User Preference → Held-out Lift PASS',r)"
      - name: Install runtime dependencies
        run: npm install
      - name: Typecheck/build renderer surface
        run: npm run build --if-present
