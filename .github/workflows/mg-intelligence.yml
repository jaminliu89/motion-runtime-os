name: MG Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'runtime/mg_planner.py'
      - 'runtime/mg_compiler.py'
      - 'runtime/mg_qa.py'
      - 'runtime/art_direction.py'
      - 'runtime/style_selector.py'
      - 'schemas/mg-plan.schema.json'
      - 'tests/**'
      - 'src/compositions/GenericMotion.tsx'
      - 'docs/MG_INTELLIGENCE_SPEC.md'
      - 'docs/ART_DIRECTION_ENGINE_SPEC.md'
      - '.github/workflows/mg-intelligence.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'schemas/mg-plan.schema.json'
      - 'tests/**'
      - 'src/compositions/GenericMotion.tsx'
      - 'docs/**'
      - '.github/workflows/mg-intelligence.yml'

jobs:
  mg-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install pytest jsonschema
      - name: Run semantic MG QA art direction and selector tests
        run: python -m pytest -q tests/test_mg_planner.py tests/test_mg_compiler.py tests/test_mg_qa.py tests/test_art_direction.py tests/test_art_direction_compiler.py tests/test_style_selector.py
      - name: Validate selected style through MG Plan and Motion IR
        run: >-
          python -c "import json; from jsonschema import Draft202012Validator; from runtime.mg_planner import plan; from runtime.style_selector import select; from runtime.art_direction import apply_profile; from runtime.mg_compiler import compile_motion_ir; from runtime.mg_qa import evaluate; d={'segments':[{'id':'r','start':0,'end':3,'transcript':'30 products','narrative_function':'proof','attention_target':'30','confidence':.9},{'id':'t','start':3,'end':6,'transcript':'but quantity is not the problem','narrative_function':'turn','attention_target':'but','confidence':.9},{'id':'v','start':6,'end':10,'transcript':'the real problem is the loop','narrative_function':'revelation','attention_target':'real problem','confidence':.93}]}; choice=select({'content_type':'AI product business explanation','keywords':['data']},d); assert choice['selected_profile']=='precision_tech', choice; p=apply_profile(plan(d),choice['selected_profile']); Draft202012Validator(json.load(open('schemas/mg-plan.schema.json'))).validate(p); q=evaluate(p); assert q['status']=='pass', q; m=compile_motion_ir(p,d,source_asset_ref='assets/source.mp4'); Draft202012Validator(json.load(open('schemas/motion-ir.schema.json'))).validate(m); assert m['art_direction']['profile_id']==choice['selected_profile']; print('Style Selection → MG Plan → QA → Motion IR PASS')"
      - name: Install runtime dependencies
        run: npm install
      - name: Typecheck/build renderer surface
        run: npm run build --if-present
