schema_version: 2
providers:
  remotion:
    status: verified_primary
    type: local_or_cloud_programmatic
    strengths: [deterministic, editable, parameterized, captions, audio, data_viz, reproducible]
    contract_path: runtime/providers/provider-contract.mjs
    runtime_adapter_path: runtime/providers/remotion-provider.mjs
    runner_path: scripts/run-remotion-provider.mjs
    verified_capabilities: [local_render, mp4, png_stills, subtitles, audio]
  hyperframes:
    status: capability_discovery_required
    type: remote_provider
    strengths: [provider_native_generation, programmable_video]
    contract_path: runtime/providers/provider-contract.mjs
    runtime_adapter_path: runtime/providers/hyperframes-provider.mjs
    requires_runtime_capability_discovery: true
    verified: false
  html_motion:
    status: planned
    strengths: [lightweight, svg, css, browser]
  threejs:
    status: planned
    strengths: [3d_webgl, camera, particles]
  blender:
    status: future
    strengths: [3d, physics, cinematic_render]
  unreal:
    status: future
    strengths: [realtime_3d, cinematic, virtual_production]
routing_dimensions: [capability, determinism, editability, quality, latency, cost, privacy, offline_requirement, output_format]
